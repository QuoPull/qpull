  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#14161A" text-anchor="middle">
    <rect x="18" y="44" width="62" height="36" rx="6" fill="#F3F1EB" stroke="#14161A"/>
    <text x="49" y="66">ETH</text>
    <path d="M84 62 H120" stroke="#14161A" stroke-width="2"/><path d="M116 57 L122 62 L116 67" fill="none" stroke="#14161A" stroke-width="2"/>
