# QTIP protocol — Foundry config
# Install toolchain:  curl -L https://foundry.paradigm.xyz | bash && foundryup
# Install deps:       forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "prague"      # enables the EIP-2537 BLS12-381 precompiles (live on RH, §13.2) for BlsDrandOracle tests
optimizer = true
optimizer_runs = 200
# via_ir: the pack-registry draw folds the virtual free-entry selection into drawFrom, whose local set
# exceeds the legacy stack-slot limit; the IR pipeline schedules it (optimizer already on). No effect on
# evm_version/precompiles; gas is equal-or-better, so the assertLt(...) block-fit checks still hold.
via_ir = true
bytecode_hash = "none"
ffi = false
# RH testnet is a fast L2 with a non-archive RPC that prunes old state quickly, so a cached fork block
# goes stale between runs (forge then errors "failed to get block number ..."). Disable fork caching so
# every run forks from the latest block. (A dev convenience for fork tests; no effect on deployed bytecode.)
no_storage_caching = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./web/art/onchain-preview" }]

# NOTE: the BLS precompile check (§13.2) is NOT a forge test — it calls the real RPC node
# directly, because precompile presence is decided by the REMOTE chain, not this evm_version.
# See script/bls_precompile_check.sh.

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
rh = "${RH_RPC_URL}"
